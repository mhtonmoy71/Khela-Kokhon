<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>খেলা কখন? লাইভ স্কোর</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* অন্যের সাইটে বসে, তাই সব রং টোকেনে; থিম ?theme=dark দিয়ে, না দিলে লাইট */
    :root { --bg: #ffffff; --card: #ffffff; --line: #e6ecea; --text: #0e1a16; --muted: #5f726b; --green: #00875a; --live: #e11d48; --head: #f4f7f6; --accent: var(--green); color-scheme: light; }
    :root[data-theme="dark"] { --bg: #151f1c; --card: #151f1c; --line: rgba(255,255,255,.08); --text: #eef5f2; --muted: #8ea39b; --green: #00e676; --live: #ff4d5e; --head: #1c2925; color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif; font-size: 14px; }
    .w { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .top b { font-size: 15px; font-weight: 700; }
    .top span { font-size: 12px; color: var(--muted); }
    .lv-n { display: inline-flex; align-items: center; gap: 5px; color: var(--live); font-weight: 700; font-size: 12px; }
    .lv-n i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: p 1.4s infinite; }
    @keyframes p { 50% { opacity: .3; } }
    .g-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--head); font-weight: 600; font-size: 13px; }
    .g-h img { width: 18px; height: 18px; object-fit: contain; }
    a.r { display: grid; grid-template-columns: 44px 1fr auto 1fr; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
    a.r:hover { background: var(--head); }
    .st { font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; line-height: 1.2; }
    .st.live { color: var(--live); }
    .tm { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; }
    .tm.h { justify-content: flex-end; text-align: right; }
    .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tm img { width: 20px; height: 20px; object-fit: contain; flex: none; }
    .tm.win span { font-weight: 700; }
    .sc { min-width: 54px; text-align: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
    .sc.t { font-weight: 600; font-size: 12.5px; color: var(--muted); }
    .sc.live { color: var(--live); }
    .empty { padding: 22px 12px; text-align: center; color: var(--muted); }
    .ft { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .ft a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .ft a b { color: #f59e0b; }
    .sk { height: 44px; margin: 8px 12px; border-radius: 8px; background: var(--head); }
  </style>
</head>
<body>
  <div class="w" id="w"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <script type="module" src="./live.js"></script>
</body>
</html>
