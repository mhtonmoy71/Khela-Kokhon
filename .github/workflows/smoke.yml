# প্রতিটা PR আর main-এ: সাইট বানিয়ে প্রধান পাতাগুলো খুলে দেখা (scripts/smoke.mjs)
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
