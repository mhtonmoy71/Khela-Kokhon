      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }

      /* ── স্প্ল্যাশ: ঘড়ির রিং আঁকা হয়, দাগ ফোটে, কাঁটা ঘুরে বসে, নাম ঝাপসা থেকে স্পষ্ট; বেরোনোর সময় সামনে এগিয়ে মিলিয়ে যায় ── */
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        background: radial-gradient(120% 80% at 50% 38%, #0b5a44 0%, #06362a 42%, #04130f 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity .55s ease, transform .55s cubic-bezier(.4, 0, .2, 1);
      }
      #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
      /* পেছনে মাঠের মাঝের বৃত্ত আর রেখা, হালকা করে আঁকা হয় */
      #splash-pitch { position: absolute; width: min(150vw, 900px); height: min(150vw, 900px); opacity: .09; pointer-events: none; }
      #splash-pitch circle, #splash-pitch line { fill: none; stroke: #fff; stroke-width: 1.2; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: spDraw 2.2s .1s cubic-bezier(.6, 0, .2, 1) forwards; }
      #splash-glow { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(0,230,118,.28), rgba(0,230,118,0) 65%); filter: blur(6px); animation: spGlow 2.4s ease-in-out infinite alternate; pointer-events: none; }
      #splash-logo { position: relative; width: 108px; height: 108px; animation: spIn .7s cubic-bezier(.2, 1.3, .4, 1) both; filter: drop-shadow(0 10px 30px rgba(0,0,0,.45)); }
      #splash-logo svg { display: block; overflow: visible; }
      #splash-logo .ring { stroke-dasharray: 240; stroke-dashoffset: 240; animation: spDraw .9s .1s cubic-bezier(.6, 0, .2, 1) forwards; }
      #splash-logo .face { opacity: 0; animation: spFade .5s .35s ease forwards; }
      #splash-logo .tick { opacity: 0; animation: spFade .3s ease forwards; }
      #splash-logo .hand { transform-origin: 40px 40px; }
      #splash-logo .h-h { animation: spHour 1s .45s cubic-bezier(.2, 1, .3, 1) both; }
      #splash-logo .h-m { animation: spMin 1s .45s cubic-bezier(.2, 1, .3, 1) both; }
      #splash-logo .h-s { animation: spSec 1s .45s cubic-bezier(.2, 1, .3, 1) both, spTick 1s 1.6s steps(1) infinite; }
      #splash-logo .kha { opacity: 0; animation: spFade .6s .8s ease forwards; }
      #splash-logo .q { opacity: 0; transform-box: fill-box; transform-origin: center; animation: spPop .5s 1s cubic-bezier(.2, 1.6, .4, 1) forwards; }
      #splash-title { font-family: 'Hind Siliguri', sans-serif; font-size: 30px; font-weight: 800; color: #fff; margin-top: 22px; letter-spacing: .5px; opacity: 0; animation: spRise .7s .55s cubic-bezier(.2, .8, .2, 1) forwards; }
      #splash-title b { color: #f59e0b; }
      #splash-tag { font-family: 'Hind Siliguri', sans-serif; font-size: 15.5px; font-weight: 600; color: #7dffb8; margin-top: 6px; opacity: 0; animation: spRise .7s .72s cubic-bezier(.2, .8, .2, 1) forwards; }
      #splash-sub { font-family: Inter, Arial, sans-serif; font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.45); margin-top: 14px; letter-spacing: 3.5px; opacity: 0; animation: spFade .8s .95s ease forwards; }
      #splash-bar { width: 120px; height: 3px; border-radius: 3px; margin-top: 30px; background: rgba(255,255,255,.08); overflow: hidden; opacity: 0; animation: spFade .4s .6s ease forwards; }
      #splash-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, #00e676, transparent); animation: spBar 1.1s .6s ease-in-out infinite; }
      @keyframes spDraw { to { stroke-dashoffset: 0; } }
      @keyframes spFade { to { opacity: 1; } }
      @keyframes spIn { from { opacity: 0; transform: scale(.7) rotate(-12deg); } to { opacity: 1; transform: none; } }
      @keyframes spHour { from { transform: rotate(-270deg); } to { transform: rotate(0); } }
      @keyframes spMin { from { transform: rotate(-420deg); } to { transform: rotate(0); } }
      @keyframes spSec { from { transform: rotate(-540deg); } to { transform: rotate(0); } }
      @keyframes spTick { 0% { transform: rotate(0); } 50% { transform: rotate(6deg); } }
      @keyframes spPop { from { opacity: 0; transform: scale(.2); } to { opacity: .95; transform: scale(1); } }
      @keyframes spRise { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes spGlow { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.1); opacity: 1; } }
      @keyframes spBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>

    <script>
      // অ্যানিমেশন শেষ হওয়া পর্যন্ত (প্রায় ১.৩ সেকেন্ড), আর পাতা লোড হওয়া পর্যন্ত; যেটা পরে
      (function () {
        const t0 = performance.now();
        window.addEventListener('load', () => {
          setTimeout(() => {
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('hide'); setTimeout(() => splash.remove(), 560); }
          }, Math.max(250, 1350 - (performance.now() - t0)));
        });
      })();
    </script>
