      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }

      #splash {
        position: fixed; inset: 0;
        background: linear-gradient(160deg, #060910 0%, #064e3b 60%, #0a1020 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-logo { animation: splashPulse 1.2s ease-in-out infinite alternate; position: relative; width: 100px; height: 100px; }
      #splash-logo svg { display: block; }
      #splash-kha {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-58%, -52%);
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 30px; font-weight: 800;
        color: rgba(255,255,255,0.18);
        pointer-events: none;
      }
      #splash-q {
        position: absolute; bottom: 16px; right: 12px;
        font-family: Arial, sans-serif;
        font-size: 20px; font-weight: 800;
        color: #f59e0b;
        pointer-events: none;
      }
      @keyframes splashPulse {
        from { transform: scale(0.92); opacity: 0.85; }
        to   { transform: scale(1.04); opacity: 1; }
      }
      #splash-title {
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 28px; font-weight: 800;
        color: #fff; margin-top: 20px; letter-spacing: 1px;
      }
      #splash-tag {
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 16px; font-weight: 600; color: #00e676; margin-top: 6px;
      }
      #splash-sub {
        font-family: Arial, sans-serif;
        font-size: 13px; color: rgba(255,255,255,0.4);
        margin-top: 14px; letter-spacing: 2px;
      }
      #splash-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #00e676; margin-top: 32px;
        animation: dotBlink 0.8s ease-in-out infinite alternate;
      }
      @keyframes dotBlink {
        from { opacity: 0.3; transform: scale(0.8); }
        to   { opacity: 1;   transform: scale(1.2); }
      }
    </style>

      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
